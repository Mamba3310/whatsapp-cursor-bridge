services:
  - type: web
    name: whatsapp-cursor-bridge
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: cursor-agent-map
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: CURSOR_API_KEY
        sync: false
      - key: CURSOR_REPO_URL
        value: https://github.com/Mamba3310/School-RRM
      - key: ALLOWED_WA_IDS
        sync: false
      - key: AGENT_STORE_PATH
        value: /var/data/agents.json
